services:
  backend:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/app/data          # PDFs persist across rebuilds
      - ./index:/app/index        # FAISS indexes persist
      - ./models:/app/models      # LoRA weights persist
      - ./eval:/app/eval          # Eval sets persist
      - ./train:/app/train        # Training data persists
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
